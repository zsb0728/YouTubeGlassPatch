name: Build YouTube Glass Framework
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build arm64 iOS framework
        run: |
          set -euxo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p out
          xcrun clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=16.0 -fobjc-arc -fblocks -O2 -dynamiclib YouTubeGlassV3.m -framework UIKit -framework Foundation -framework QuartzCore -framework CoreGraphics -install_name '@executable_path/Frameworks/YouTubeGlass.dylib' -current_version 3.1 -compatibility_version 1.0 -o out/YouTubeGlass.dylib
          file out/YouTubeGlass.dylib
          otool -L out/YouTubeGlass.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: YouTubeGlass-dylib
          path: out/YouTubeGlass.dylib
          retention-days: 30
